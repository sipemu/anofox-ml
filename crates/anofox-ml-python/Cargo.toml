[package]
name = "anofox-ml-python"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Not published on crates.io — this is a PyO3 cdylib extension module built
# with maturin, not a normal Rust crate.
publish = false

[lib]
name = "anofox_ml_python"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
numpy = "0.30"
ndarray = { workspace = true }
anofox-ml-core = { workspace = true }
anofox-ml-registry = { workspace = true }
anofox-ml-metrics = { workspace = true }
anofox-ml-tune = { path = "../anofox-ml-tune" }
serde_json = { workspace = true }
